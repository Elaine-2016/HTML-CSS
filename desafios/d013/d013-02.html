<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 300px;
            border-collapse: collapse;
            border: 5px solid black;
        }       
        td{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }        
    </style>
</head>
<body>
    <h1>Mesclando tabelas</h1>
    <table>
        <tr><!--Primeira linha da tabela-->
            <td>1</td>
            <td>2</td>
            <td rowspan="2">3</td>
            <td>4</td>              
        </tr>
        <tr><!--Segunda linha da tabela-->
            <td>5</td>
            <td>6</td>
            <td>7</td>            
        </tr>
        <tr><!--Terceira linha da tabela-->
            <td colspan="3">8</td>
            <td>9</td>            
        </tr>
        <tr><!--Quarta linha da tabela-->
            <td rowspan="2">10</td>
            <td colspan="2">11</td>
            <td>12</td>
        </tr>
         <tr><!--Quinta linha da tabela-->
            <td>13</td>
            <td>14</td>
            <td>15</td>
        </tr>
    </table>
    
</body>
</html>
