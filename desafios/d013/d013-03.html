<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 300px;
            border-collapse: collapse;
            border: 3px solid black;
        } 
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;

        }      
        td, th{
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }        
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>    
    <table>
        <caption>
            Filmes Favoritos
        </caption>
        <thead>
            <tr><!--Primeira linha da tabela-->
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>                         
            </tr>
        </thead>
        <tbody>
            <tr><!--Segunda linha da tabela-->
                <th rowspan="3" scope="rowgroup">Mulheres</th>
                <td>Ana</td>
                <td>Alien</td>
                <td>Rambo</td>
                <td>Vingadores</td>                    
            </tr>
            <tr><!--Terceira linha da tabela-->
                <td>Bea</td>
                <td>Hulk</td>
                <td>Inception</td>
                <td>Batman</td>            
            </tr>
            <tr><!--Quarta linha da tabela-->
                <td>Cleide</td>
                <td>Oblivion</td>
                <td>Matrix</td>
                <td>Big Hero</td>  
            </tr>
            <tr><!--Quinta linha da tabela-->
                <th rowspan="3" scope="rowgroup">Homens</th>   
                <td>Bruno</td>
                <td>Intocáveis</td>
                <td>Amnésia</td>
                <td>Gladiador</td>
            </tr>
            <tr><!--Sexta linha da tabela-->
                <td>Daniel</td>
                <td>Wall-E</td>
                <td>OldBoy</td>
                <td>Dangal</td>
                            
            </tr>
            <tr><!--Setimma linha da tabela-->
                <td>Fabiano</td>
                <td>Star Wars</td>
                <td>Táxi</td>
                <td>Toy Story</td>              
            </tr>
        </tbody>       
    </table>
    
</body>
</html>
