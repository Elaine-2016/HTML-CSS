<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            border-collapse: collapse;
            border: 3px solid black;
        } 
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;

        }      
        th{
            border: 1px solid black;
            background-color: grey;
            color: white;
            padding: 8px;
            text-align: center;
        }
        th.area{
            border: 1px solid black;
            background-color: white;
            color: black;          
            padding: 8px;
            text-align: center;
        }
        td{
            border: 1px solid black;          
            padding: 8px;
            text-align: center;
        }
        td.media{
            border: 1px solid black;
            background-color: grey;
            color: white;
            padding: 8px;
            text-align: center;
        }           
    </style>
</head>
<body>
    <h1>Desafio de tabelas</h1>    
    <table>
        <caption>
            Boletim
        </caption>
        <thead>
            <tr><!--Primeira linha do cabeçalho da tabela-->
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2"  scope="colgroup">Notas</th>
                 <th rowspan="2" scope="col">Média</th>                        
            </tr>
            <tr> <!--Segunda linha do cabeçalho da tabela-->
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 1</th>
            </tr>
        </thead>
        <tbody>
            <tr><!--Primeira linha da tabela-->
                <th rowspan="4" scope="rowgroup" class="area">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>                    
            </tr>
            <tr><!--Segunda linha da tabela-->
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>            
            </tr>
            <tr><!--Terceira linha da tabela-->           
                <td>Quimica</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>  
            </tr>
            <tr><!--Quarta linha da tabela-->
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>  
            </tr>
            <tr><!--Quinta linha da tabela-->
                <th colspan="4" scope="rowgroup">Média de Exatas</th>   
                <td class="media">0.0</td>                
            </tr>
            <tr><!--Sexta linha da tabela-->
                <th rowspan="2" scope="rowgroup" class="area">Humanas</th>   
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>                
            </tr>
            <tr><!--Setima linha da tabela-->
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
                                           
            </tr> 
            <tr><!--Setima linha da tabela-->
               <th colspan="4" scope="rowgroup">Média de Humanas</th>   
                <td class="media">0.0</td>                             
            </tr>            
        </tbody>       
    </table>
    
</body>
</html>
